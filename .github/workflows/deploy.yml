name: Deploy server to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_PATH: /var/www/server
  PM2_APP_NAME: server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -e
            mkdir -p "$DEPLOY_PATH"

      - name: Upload build artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: .output,package.json,package-lock.json
          target: ${{ env.DEPLOY_PATH }}

      - name: Start or restart PM2 app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,PM2_APP_NAME
          script: |
            set -e
            # Load user profile to get full PATH (nvm, etc.)
            [ -f ~/.bashrc ] && source ~/.bashrc || true
            [ -f ~/.profile ] && source ~/.profile || true
            export PATH="$PATH:$(npm config get prefix)/bin"

            echo "PATH=$PATH"
            echo "pm2 location: $(which pm2 || echo 'NOT FOUND')"
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"

            cd "$DEPLOY_PATH"
            npm install --omit=dev

            if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
              pm2 restart "$PM2_APP_NAME" --update-env
            else
              pm2 start npm --name "$PM2_APP_NAME" -- run start
            fi

            pm2 save

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            pm2 list